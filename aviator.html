<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Aviator Game</title>
   <style>
      body {margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;}
      canvas {background:#87ceeb;display:block;margin:0 auto;border:2px solid #000;}
   </style>
</head>
<body>
   <canvas id="game" width="600" height="400"></canvas>
   <script>
   const canvas = document.getElementById('game');
   const ctx = canvas.getContext('2d');
   const plane = {x:50, y:200, w:40, h:30, dy:0};
   let obstacles = [];
   let score = 0;
   let frame = 0;
   let gameOver = false;

   function createObstacle(){
      const height = Math.random()*200 + 50;
      const gap = 120;
      obstacles.push({x:canvas.width, y:0, w:40, h:height});
      obstacles.push({x:canvas.width, y:height+gap, w:40, h:canvas.height - height - gap});
   }

   function drawPlane(){
      ctx.fillStyle = 'red';
      ctx.fillRect(plane.x, plane.y, plane.w, plane.h);
   }

   function drawObstacles(){
      ctx.fillStyle = 'green';
      obstacles.forEach(ob => ctx.fillRect(ob.x, ob.y, ob.w, ob.h));
   }

   function update(){
      if(gameOver) return;
      requestAnimationFrame(update);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      plane.y += plane.dy;
      plane.dy *= 0.9;
      plane.y = Math.max(0, Math.min(canvas.height - plane.h, plane.y));
      obstacles.forEach(ob => ob.x -= 2);
      if(obstacles[0] && obstacles[0].x + obstacles[0].w < 0) obstacles.splice(0,2);
      if(frame % 150 === 0) createObstacle();
      drawPlane();
      drawObstacles();
      score++;
      ctx.fillStyle = '#000';
      ctx.font = '20px sans-serif';
      ctx.fillText('Score: ' + score, 10, 25);
      obstacles.forEach(ob => {
         if(plane.x < ob.x + ob.w && plane.x + plane.w > ob.x && plane.y < ob.y + ob.h && plane.y + plane.h > ob.y){
            gameOver = true;
            ctx.fillStyle = 'black';
            ctx.font = '30px sans-serif';
            ctx.fillText('Game Over - Space to restart', 60, canvas.height/2);
         }
      });
      frame++;
   }

   document.addEventListener('keydown', e => {
      if(e.code === 'ArrowUp') plane.dy = -5;
      if(e.code === 'ArrowDown') plane.dy = 5;
      if(e.code === 'Space' && gameOver){
         obstacles = [];
         score = 0;
         frame = 0;
         plane.y = 200;
         gameOver = false;
         update();
      }
   });

   createObstacle();
   update();
   </script>
</body>
</html>
